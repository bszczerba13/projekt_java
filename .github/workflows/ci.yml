name: UI Tests
on:
  push:
  pull_request:

jobs:
  ui-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pull Docker images
        working-directory: docker
        run: docker compose pull

      - name: Inspect pulled web image
        run: |
          docker image inspect testsmith/practice-software-testing-web \
            --format 'Architecture={{.Architecture}} OS={{.Os}}'
          
      - name: Show runner architecture
        run: |
          uname -m
          arch
          docker version
          docker info

      - name: Inspect Docker Hub manifest
        run: docker buildx imagetools inspect testsmith/practice-software-testing-web

      - name: Start Docker environment
        working-directory: docker
        run: docker compose up -d --wait

      - name: Inspect web image
        run: docker inspect toolshop-web

      - name: Run tests
        run: mvn clean test -Denvironment=docker

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Show container status
        if: always()
        working-directory: docker
        run: docker compose ps -a

      - name: Show web container logs
        if: always()
        working-directory: docker
        run: docker compose logs web

      - name: Stop Docker environment
        if: always()
        working-directory: docker
        run: docker compose down